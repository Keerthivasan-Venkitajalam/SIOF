apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: siof-storage
  namespace: {{ .Values.namespace }}
spec:
  serviceName: siof-storage-headless
  replicas: 3
  selector:
    matchLabels:
      app: siof-storage
  template:
    metadata:
      labels:
        app: siof-storage
    spec:
      initContainers:
        - name: init-storage
          image: busybox:1.36
          command: ["sh", "-c", "echo initializing storage"]
      containers:
        - name: storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 7687
          volumeMounts:
            - name: data
              mountPath: /var/lib/siof
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
