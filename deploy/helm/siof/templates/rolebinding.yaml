apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: siof-rolebinding
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: siof-sa
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: siof-role
