deployment:
  replicas: 4
resources:
  requests:
    cpu: 1000m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 4Gi
image:
  tag: prod
hpa:
  minReplicas: 4
  maxReplicas: 20
ingress:
  hostname: siof.example.com
  tls:
    enabled: true
    secretName: siof-prod-tls
istio:
  enabled: true
  mtlsMode: STRICT
vault:
  enabled: true
