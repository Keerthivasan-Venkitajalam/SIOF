[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siof"
version = "2.0.1"
description = "Semantic Integrity and Orchestration Framework - AI-native Python toolkit for maintaining codebase integrity"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Keerthivasan S V", email = "keerthivasansv2006@outlook.com"}]
license = "MIT"
keywords = ["ai", "code-analysis", "graph", "mcp", "sustainability", "semantic-integrity", "autonomous-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/Keerthivasan-Venkitajalam/SIOF"
Documentation = "https://github.com/Keerthivasan-Venkitajalam/SIOF#readme"
Repository = "https://github.com/Keerthivasan-Venkitajalam/SIOF"
"Bug Tracker" = "https://github.com/Keerthivasan-Venkitajalam/SIOF/issues"
Changelog = "https://github.com/Keerthivasan-Venkitajalam/SIOF/blob/main/CHANGELOG.md"

[project.optional-dependencies]
green = ["psutil>=5.9"]
storage = ["neo4j>=5.20.0", "falkordb>=1.0.10"]
release = ["build>=1.2.1", "twine>=5.1.1"]
test = ["pytest>=8.0", "pytest-cov>=4.0", "hypothesis>=6.0"]
dev = ["ruff>=0.1.0", "black>=23.0", "mypy>=1.0", "types-psutil>=5.9", "types-PyYAML>=6.0.12"]

[project.scripts]
siof = "siof.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "PT", "RUF"]
ignore = [
    "E501",   # line-length handled by black
    "W293",   # legacy trailing whitespace in multiline docstrings/comments
    "B904",   # keep existing exception style for now
    "B905",   # zip(strict=...) migration tracked separately
    "N818",   # existing exception names without Error suffix
    "A001",   # intentional variable names in tests/mocks
    "C408",   # existing literal style in tests/mocks
    "PT011",  # existing broad raises assertions in tests
    "PT018",  # existing composite assertions in tests
    "PT030",  # existing broad warns assertions in tests
    "RUF002", # existing unicode in docstrings
    "RUF003", # existing unicode in comments
    "RUF012", # existing mutable class defaults in mocks
    "RUF043", # existing pytest match patterns in tests
    "RUF059", # existing intentionally-unused unpacked vars in tests
    "F841",   # existing intentionally-unused locals in tests/mocks
    "B007",   # existing intentionally-unused loop vars in tests
]

[tool.ruff.lint.isort]
known-first-party = ["siof"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
